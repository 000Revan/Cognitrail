server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端业务接口
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;

        # Agent SSE 流式响应不缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 后端健康检查
    location /health {
        proxy_pass http://backend:8000;
    }

    # 静态资源与 Vue Router 页面
    location / {
        try_files $uri $uri/ /index.html;
    }
}